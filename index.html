<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#111827">
<title>JANI TOTO - Acak 4D</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 22px;
    display: flex; align-items: center; justify-content: center;
    background: #0b1220; color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  .card {
    width: 100%; max-width: 440px; padding: 25px;
    background: #182338; border: 1px solid #34445f;
    border-radius: 22px; box-shadow: 0 18px 45px #0007;
    text-align: center;
  }
  h1 { margin: 0; font-size: 29px; letter-spacing: 2px; }
  .subtitle { margin: 8px 0 24px; color: #a8b7cc; }
  .display {
    min-height: 105px; display: flex; align-items: center; justify-content: center;
    margin: 18px 0; padding: 14px 5px; border-radius: 15px;
    background: #080f1d; border: 1px solid #41516b;
    color: #38bdf8; font-size: clamp(48px, 15vw, 70px);
    font-weight: 800; letter-spacing: 8px; font-variant-numeric: tabular-nums;
  }
  label { display: block; margin: 18px 0 8px; text-align: left; color: #d3dbea; }
  input {
    display: block; width: 100%; padding: 14px; border-radius: 10px;
    border: 1px solid #52627a; background: #0d1728; color: white;
    font-size: 18px;
  }
  button {
    width: 100%; padding: 15px; margin-top: 13px; border: 0;
    border-radius: 11px; font-size: 16px; font-weight: 750;
    cursor: pointer; -webkit-appearance: none;
  }
  button:active { transform: scale(.98); }
  #make { background: #38bdf8; color: #082f49; }
  #copy { background: #34445f; color: white; }
  #status { min-height: 20px; margin: 12px 0 0; color: #86efac; font-size: 14px; }
  #results {
    margin-top: 16px; padding: 13px; border-radius: 10px;
    background: #0d1728; color: #e2e8f0; text-align: left;
    line-height: 2; overflow-wrap: anywhere; min-height: 48px;
  }
  .note { margin: 18px 0 0; color: #94a3b8; font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>
<main class="card">
  <h1>JANI TOTO</h1>
  <p class="subtitle">Generator Angka Acak 4D</p>

  <div class="display" id="mainNumber" aria-live="polite">0000</div>

  <label for="quantity">Berapa angka yang mau dibuat? (1–100)</label>
  <input id="quantity" type="number" inputmode="numeric" min="1" max="100" value="1">

  <button id="make" type="button">ACAK ANGKA 4D</button>
  <button id="copy" type="button">SALIN SEMUA ANGKA</button>

  <div id="status" role="status"></div>
  <div id="results">Tekan tombol ACAK ANGKA 4D untuk mulai.</div>
  <p class="note">Angka dihasilkan secara acak dan bukan prediksi atau jaminan hasil undian.</p>
</main>

<script>
(function () {
  "use strict";

  var numbers = [];
  var makeButton = document.getElementById("make");
  var copyButton = document.getElementById("copy");
  var quantityInput = document.getElementById("quantity");
  var mainNumber = document.getElementById("mainNumber");
  var results = document.getElementById("results");
  var status = document.getElementById("status");

  function randomFourDigits() {
    // Crypto randomness when available; Math.random fallback for older browsers.
    var value;
    if (window.crypto && window.crypto.getRandomValues) {
      var data = new Uint32Array(1);
      var limit = Math.floor(4294967296 / 10000) * 10000;
      do {
        window.crypto.getRandomValues(data);
        value = data[0];
      } while (value >= limit);
      return String(value % 10000).padStart(4, "0");
    }
    return String(Math.floor(Math.random() * 10000)).padStart(4, "0");
  }

  makeButton.addEventListener("click", function () {
    var quantity = parseInt(quantityInput.value, 10);
    if (!Number.isFinite(quantity)) quantity = 1;
    quantity = Math.max(1, Math.min(100, quantity));
    quantityInput.value = quantity;

    numbers = [];
    for (var i = 0; i < quantity; i++) {
      numbers.push(randomFourDigits());
    }

    mainNumber.textContent = numbers[0];
    results.textContent = numbers.join("   ");
    status.textContent = "Berhasil membuat " + numbers.length + " angka.";
  });

  copyButton.addEventListener("click", function () {
    if (numbers.length === 0) {
      status.textContent = "Buat angka terlebih dahulu.";
      return;
    }
    var textToCopy = numbers.join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textToCopy).then(function () {
        status.textContent = "Angka berhasil disalin.";
      }).catch(function () {
        fallbackCopy(textToCopy);
      });
    } else {
      fallbackCopy(textToCopy);
    }
  });

  function fallbackCopy(value) {
    var area = document.createElement("textarea");
    area.value = value;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    try {
      document.execCommand("copy");
      status.textContent = "Angka berhasil disalin.";
    } catch (e) {
      status.textContent = "Salin manual dari daftar angka.";
    }
    document.body.removeChild(area);
  }
})();
</script>
</body>
</html>
