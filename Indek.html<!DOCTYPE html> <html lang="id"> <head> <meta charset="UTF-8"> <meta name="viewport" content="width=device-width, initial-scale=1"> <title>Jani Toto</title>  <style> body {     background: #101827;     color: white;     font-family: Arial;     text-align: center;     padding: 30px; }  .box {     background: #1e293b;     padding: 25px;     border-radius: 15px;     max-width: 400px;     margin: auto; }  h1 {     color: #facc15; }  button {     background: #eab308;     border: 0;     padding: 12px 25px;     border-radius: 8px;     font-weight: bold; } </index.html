<!DOCTYPE html><html lang="id"><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>XR CASINO</title><style>body{background:#10131c;color:white;font-family:Arial;text-align:center;padding:25px}.box{background:#20283a;padding:25px;border-radius:18px;max-width:380px;margin:50px auto}h1{color:#ffd700}.slot{font-size:55px;margin:25px}button{background:#e5b800;border:0;padding:14px 30px;border-radius:10px;font-weight:bold}small{color:#aaa}</style></head><body><div class="box"><h1>🎰 XR CASINO</h1><p>DEMO KASINO VIRTUAL</p><h3>Kredit: <span id="k">1000</span></h3><div class="slot" id="s">🍒 🍋 🍇</div><button onclick="spin()">PUTAR SLOT</button><p id="m">Selamat datang!</p><small>SIMULASI TANPA UANG ASLI</small></div><script>let k=1000;function spin(){if(k<10){document.getElementById("m").innerText="Kredit habis";return}k-=10;let a=["🍒","🍋","🍇","🔔","💎"];let x=a[Math.floor(Math.random()*5)],y=a[Math.floor(Math.random()*5)],z=a[Math.floor(Math.random()*5)];document.getElementById("s").innerText=x+" "+y+" "+z;if(x===y&&y===z){k+=100;document.getElementById("m").innerText="Menang 100 kredit virtual!"}else{document.getElementById("m").innerText="Coba lagi!"}document.getElementById("k").innerText=k}</script></body></html>
